name: CI

# Remote source validation runs once per merge into main, on the merged revision:
# only when a pull request whose base is main is closed *and merged*. Commits,
# branch pushes, opening, updating or labelling a pull request, and closing one
# without merging run nothing. Local checks (`make check`, pre-commit hooks) are
# separate and should be run before merging.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  source-validation:
    name: Source validation
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      # The learning guide is committed under guide/, so no submodule or secret is
      # needed. The outline PDFs and reading copies are git-ignored, so
      # `make verify-outlines` and `make pdf` run locally only.
      # Do not switch to pull_request_target: it would run untrusted pull-request code
      # with write permissions.
      # merge_commit_sha is the commit the merge created on main (merge, squash or
      # rebase), so the job validates the merged revision rather than the head branch.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.7"

      - name: Install pinned Python
        run: uv python install

      - name: Install locked environment
        run: uv sync --frozen --no-editable

      - name: Verify supported Python runtime
        run: uv run --frozen --no-editable python -m trading_notes.cli.check_runtime

      - name: Run source validation
        run: make source-check
