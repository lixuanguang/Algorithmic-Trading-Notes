# guide/ is a vendored copy of the learning guide; it is updated by copying, not edited here.
exclude: ^guide/
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lock
        entry: uv lock --check
        language: system
        files: ^(\.python-version|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: uv run --frozen --no-editable ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --no-editable ruff format --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: make typecheck
        language: system
        files: ^((src|tools|tests)/.*\.py|typings/.*\.pyi|pyproject\.toml|notes/artefacts/(short-term-funding/funding-repo-checks|rates-credit-mortgages/(fra-settlement|multicurve)-check|crypto-perpetuals/amm-checks|corporate-finance/country-risk-premium-check|financial-statement-analysis/cash-flow-linkage-check|volatility-options/bsm-svi-checks|time-value-returns/time-value-return-checks|point-in-time-data/(bitemporal-check|filing-checks|filing-timestamp-checks)|funding-crowding/spiral-checks|execution-market-making/(cme-allocation|commodity-production-latency|contract-specifications-statistics)-checks|synthetic-equity-cfd-trs/synthetic_short_checks|crypto-mm-microstructure/funding_checks|model-governance-controls/reconciliation-check|portfolio-construction/(black-litterman|erc|erc-sharpe|shrinkage)-check|risk-tail-systemic/(es-discrete-check|var-backtest-check)|reinforcement-learning-trading/cartea_jaimungal_checks|risk-parity-vol-targeting/risk-parity-checks|volatility-options/negative-hedge-ratio-check|risk-tail-systemic/garch-ewma-check|backtest-inference/(sharpe-zero-check|drawdown-resampling-checks|multiple-testing-checks|sharpe-checks)|equity-long-short-construction/projection-checks|rates-credit-mortgages/yield-shift-check|equity-long-short-construction/forecast-checks|statistical-learning-foundations/cv-checks|statistical-learning-foundations/financial-labels-capital-checks|private-wealth/concentrated-position-check|market-making-lob/model-derivations-checks|backtest-inference/sharpe-conditions-checks|option-valuation/dividend-tree-swaption-checks|market-making-lob/model-checks|short-term-funding/margin-purchase-check|forward-swap-valuation/cross-currency-basis-check|derivative-overlays/seasoned-variance-swap-check|high-dimensional-estimation/covariance-volatility-checks|etf-mechanics/etf-checks|trade-execution/trade-execution-checks|macro-asset-valuation/macro-valuation-checks|commodity-investment/commodity-return-checks|inference-simulation/correlation-independence-checks|counterparty-xva/counterparty-capital-check|option-valuation/volatility-mismatch-hedging-check|alternatives-allocation/alternatives-allocation-checks|firms-market-structure/market-structure-checks|hedge-funds/hedge-fund-checks|performance-presentation-standards/gips-checks|stochastic-calculus/stochastic-calculus-checks|market-index-construction/index-construction-checks|numerical-pricing/monte-carlo-greeks-check|currency-management/currency-management-checks|option-pricing-models/option-model-checks|economic-growth/growth-checks|derivative-overlays/overlay-checks|active-management-analysis/active-management-checks|credit-portfolios/credit-portfolio-checks|fx-mechanics-determination/fx-checks|manager-selection/manager-selection-checks|option-valuation/transaction-cost-hedging-check|capital-market-expectations/cme-checks|portfolio-risk-return/portfolio-moments-checks|digital-assets/digital-asset-checks|numerical-pricing/numerical-pricing-checks|asset-pricing-factor-models/asset-pricing-checks|backtest-inference/backtest-design-checks|bond-valuation-risk/bond-valuation-checks|corporate-credit-capital/credit-cds-securitisation-checks|counterparty-xva/counterparty-xva-checks|default-correlation/default-correlation-checks|descriptive-probability/statistics-probability-checks|equity-portfolio-management/equity-portfolio-checks|execution-market-making/dealer-queue-information-checks|execution-market-making/liquidity-market-design-checks|execution-market-making/market-estimators-rules-checks|exotic-options/exotic-option-checks|exotic-options/lookback-option-check|extreme-value/extreme-value-checks|financial-ml-methods/ml-methods-checks|financial-statement-analysis/intercorporate-fx-institutions-checks|financial-statement-analysis/statement-analysis-checks|fixed-income-portfolio/fixed-income-portfolio-checks|forward-swap-valuation/forward-swap-checks|fx-determination-forecasting/fx-panel-inference-check|inference-simulation/inference-simulation-checks|institutional-portfolios/institutional-checks|investment-planning/investment-planning-checks|linear-regression/regression-checks|macro-policy-trade/macro-policy-trade-checks|market-risk-measurement/market-risk-checks|market-simulation/order-flow-checks|market-structure-execution-quality/order-routing-fragmentation-checks|multi-asset-systematic-macro/macro-pricing-risk-checks|option-strategies/option-strategy-checks|option-valuation/option-valuation-checks|performance-evaluation/performance-evaluation-checks|portfolio-construction/kelly-check|portfolio-construction/mean-cvar-check|private-capital/private-capital-checks|private-wealth/private-wealth-checks|rate-tree-embedded-options/rate-tree-checks|real-assets/real-asset-checks|statistical-learning-foundations/afml-checks|strategic-asset-allocation/saa-checks)\.py|notes/artefacts/ruff\.toml)$
        pass_filenames: false

      - id: compendium
        name: check compendium entries, citations, labels and sections
        entry: make check-compendium
        language: system
        files: ^(compendium/.*\.tex|notes/pathways/.*\.md|tools/check_compendium\.py|src/trading_notes/structure/.*\.py)$
        pass_filenames: false

      - id: coverage
        name: check coverage records and outline crosswalk
        entry: make check-coverage
        language: system
        files: ^(notes/coverage/.*|notes/entry-evidence\.json|compendium/.*\.tex|tools/check_.*\.py|src/trading_notes/structure/.*\.py)$
        pass_filenames: false

      - id: detect-private-key
        name: detect private keys
        entry: uv run --frozen --no-editable detect-private-key
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen --no-editable trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen --no-editable end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run --frozen --no-editable check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run --frozen --no-editable check-toml
        language: system
        types: [toml]

      - id: check-json
        name: check json
        entry: uv run --frozen --no-editable check-json
        language: system
        types: [json]

      - id: check-added-large-files
        name: check added large files
        entry: uv run --frozen --no-editable check-added-large-files --maxkb=500
        language: system
        types: [file]
        # The compiled reference and the complete outline crosswalk are intentionally large.
        exclude: ^(compendium/compendium\.pdf|notes/coverage/outline-crosswalk\.json)$
