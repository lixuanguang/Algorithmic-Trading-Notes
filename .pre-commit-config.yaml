# guide/ is a vendored copy of the learning guide; it is updated by copying, not edited here.
exclude: ^guide/
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lock
        entry: uv lock --check
        language: system
        files: ^(\.python-version|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types: [python]

      - id: compendium
        name: check compendium entries, citations, labels and sections
        entry: make check-compendium
        language: system
        files: ^(compendium/.*\.tex|notes/pathways/.*\.md|tools/check_compendium\.py)$
        pass_filenames: false

      - id: coverage
        name: check coverage records and outline crosswalk
        entry: make check-coverage
        language: system
        files: ^(notes/coverage/.*|notes/entry-evidence\.json|compendium/.*\.tex|tools/check_.*\.py)$
        pass_filenames: false

      - id: detect-private-key
        name: detect private keys
        entry: uv run --frozen detect-private-key
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run --frozen check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run --frozen check-toml
        language: system
        types: [toml]

      - id: check-json
        name: check json
        entry: uv run --frozen check-json
        language: system
        types: [json]

      - id: check-added-large-files
        name: check added large files
        entry: uv run --frozen check-added-large-files --maxkb=500
        language: system
        types: [file]
        # The compiled reference and the complete outline crosswalk are intentionally large.
        exclude: ^(compendium/compendium\.pdf|notes/coverage/outline-crosswalk\.json)$
