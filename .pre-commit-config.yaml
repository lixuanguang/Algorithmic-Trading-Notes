# guide/ is a vendored copy of the learning guide; it is updated by copying, not edited here.
exclude: ^guide/
repos:
  - repo: local
    hooks:
      - id: uv-lock
        name: verify uv lock
        entry: uv lock --check
        language: system
        files: ^(\.python-version|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: ruff
        name: ruff check
        entry: uv run --frozen --no-editable ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen --no-editable ruff format --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: make typecheck
        language: system
        files: ^((src|tools|tests)/.*\.py|pyproject\.toml|notes/artefacts/(short-term-funding/funding-repo-checks|rates-credit-mortgages/(fra-settlement|multicurve)-check|crypto-perpetuals/amm-checks|corporate-finance/country-risk-premium-check|financial-statement-analysis/cash-flow-linkage-check|volatility-options/bsm-svi-checks|time-value-returns/time-value-return-checks|point-in-time-data/(bitemporal-check|filing-checks|filing-timestamp-checks)|funding-crowding/spiral-checks|execution-market-making/(cme-allocation|commodity-production-latency|contract-specifications-statistics)-checks|synthetic-equity-cfd-trs/synthetic_short_checks|crypto-mm-microstructure/funding_checks|model-governance-controls/reconciliation-check|portfolio-construction/(black-litterman|erc|erc-sharpe|shrinkage)-check|risk-tail-systemic/es-discrete-check|reinforcement-learning-trading/cartea_jaimungal_checks|risk-parity-vol-targeting/risk-parity-checks|volatility-options/negative-hedge-ratio-check|risk-tail-systemic/garch-ewma-check|backtest-inference/(sharpe-zero-check|drawdown-resampling-checks))\.py|notes/artefacts/ruff\.toml)$
        pass_filenames: false

      - id: compendium
        name: check compendium entries, citations, labels and sections
        entry: make check-compendium
        language: system
        files: ^(compendium/.*\.tex|notes/pathways/.*\.md|tools/check_compendium\.py|src/trading_notes/structure/.*\.py)$
        pass_filenames: false

      - id: coverage
        name: check coverage records and outline crosswalk
        entry: make check-coverage
        language: system
        files: ^(notes/coverage/.*|notes/entry-evidence\.json|compendium/.*\.tex|tools/check_.*\.py|src/trading_notes/structure/.*\.py)$
        pass_filenames: false

      - id: detect-private-key
        name: detect private keys
        entry: uv run --frozen --no-editable detect-private-key
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --frozen --no-editable trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --frozen --no-editable end-of-file-fixer
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: uv run --frozen --no-editable check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: check toml
        entry: uv run --frozen --no-editable check-toml
        language: system
        types: [toml]

      - id: check-json
        name: check json
        entry: uv run --frozen --no-editable check-json
        language: system
        types: [json]

      - id: check-added-large-files
        name: check added large files
        entry: uv run --frozen --no-editable check-added-large-files --maxkb=500
        language: system
        types: [file]
        # The compiled reference and the complete outline crosswalk are intentionally large.
        exclude: ^(compendium/compendium\.pdf|notes/coverage/outline-crosswalk\.json)$
