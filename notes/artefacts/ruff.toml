# Lint settings for notes/artefacts/: the repository's, plus the legacy exemptions of the
# evidence scripts not yet migrated to trading_notes. Ruff uses the closest configuration for
# each file, so these exemptions cannot reach code outside this folder.
extend = "../../pyproject.toml"

[lint.per-file-ignores]
# Unmigrated evidence scripts record one computation each and are documented by their
# module docstring and the source-review records, not as a library API. Their long data,
# formula and printed-result lines, source-notation variable names (l, I, O), named
# lambdas for numeric functions and math-symbol first words (mu, lambda, t) are kept, and
# only ANN401 (explicit Any) of the annotation rules applies. Patterns are relative to this
# folder; the negated pattern names the migrated entrypoints, which get every rule. Add an
# entrypoint here, and to [tool.mypy] files in pyproject.toml, as its artefact migrates.
"!{short-term-funding/funding-repo-checks.py,rates-credit-mortgages/fra-settlement-check.py,rates-credit-mortgages/multicurve-check.py,crypto-perpetuals/amm-checks.py,corporate-finance/country-risk-premium-check.py,financial-statement-analysis/cash-flow-linkage-check.py,volatility-options/bsm-svi-checks.py,time-value-returns/time-value-return-checks.py,point-in-time-data/bitemporal-check.py,point-in-time-data/filing-checks.py,point-in-time-data/filing-timestamp-checks.py,funding-crowding/spiral-checks.py,execution-market-making/cme-allocation-checks.py,crypto-mm-microstructure/funding_checks.py,execution-market-making/commodity-production-latency-checks.py,execution-market-making/contract-specifications-statistics-checks.py,synthetic-equity-cfd-trs/synthetic_short_checks.py,model-governance-controls/reconciliation-check.py,portfolio-construction/black-litterman-check.py,portfolio-construction/erc-check.py,portfolio-construction/erc-sharpe-check.py,risk-tail-systemic/es-discrete-check.py,reinforcement-learning-trading/cartea_jaimungal_checks.py,portfolio-construction/shrinkage-check.py,risk-parity-vol-targeting/risk-parity-checks.py,volatility-options/negative-hedge-ratio-check.py,risk-tail-systemic/garch-ewma-check.py,backtest-inference/sharpe-zero-check.py,backtest-inference/drawdown-resampling-checks.py}" = [
