[project]
name = "algorithmic-trading-notes"
version = "0.1.0"
description = "Structural checkers and numerical evidence scripts for the compendium"
readme = "README.md"
requires-python = "==3.14.*"
classifiers = ["Private :: Do Not Upload"]
# Numerical check scripts in notes/artefacts/ (numpy, scipy; statsmodels for one ML check).
dependencies = [
    "numpy==2.4.6",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pre-commit-hooks==6.0.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.5",
]
# Empirical reruns that read retained spreadsheets; not needed for `make check`.
empirical = [
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[build-system]
# uv uses its built-in backend when this pin matches the running uv, so no build download.
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading_notes"

[tool.uv]
required-version = "==0.12.7"
# The reusable code under src/trading_notes is installed as a package, so scripts and tests
# import it normally instead of modifying sys.path. It is installed non-editable: CPython
# skips an editable install's .pth file once macOS flags it hidden, as file sync can do
# inside ~/Documents. uv 0.12.7 has no project setting for this, and any `uv sync` or
# `uv run` without --no-editable reinstalls the project editable, so every such command in
# the Makefile, the pre-commit hooks, CI and the README passes --no-editable (see
# tests/test_installation.py). The cache keys reinstall the package whenever a source file
# changes, so a non-editable copy never goes stale.
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
default-groups = ["dev"]
# Transitive versions kept equal to the other research repository where they overlap.
constraint-dependencies = ["pandas==3.0.5"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "."]
# Preserved historical runs are kept exactly as they were executed.
extend-exclude = ["notes/artefacts/**/superseded-*", "guide", "reading_materials", "reading materials"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF", "D", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Evidence modules keep their provenance docstrings and each printed check name on one
# source line, as printed. The legacy exemptions of unmigrated artefacts are scoped to that
# folder by notes/artefacts/ruff.toml; all other code gets every rule.
"src/trading_notes/numerical/{funding_repo,fra_settlement,multicurve,amm_pool,country_risk_premium,cash_flow_linkage,bsm_svi,time_value_returns,bitemporal,filing_deadlines,filing_timestamps,margin_spiral,cme_allocation,perpetual_funding,commodity_latency,contract_statistics,synthetic_short}.py" = [
    "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort.import-heading]
standard-library = "standard library imports"
third-party = "third party library imports"
first-party = "project library imports"
local-folder = "project library imports"

[tool.mypy]
# Strict checking of the migrated scope: the package, its entrypoints and their tests.
# Numerical artefacts join this list as they are migrated (see notes/artefacts/ruff.toml).
files = [
    "src",
    "tools",
    "tests",
    "notes/artefacts/short-term-funding/funding-repo-checks.py",
    "notes/artefacts/rates-credit-mortgages/fra-settlement-check.py",
    "notes/artefacts/rates-credit-mortgages/multicurve-check.py",
    "notes/artefacts/crypto-perpetuals/amm-checks.py",
    "notes/artefacts/corporate-finance/country-risk-premium-check.py",
    "notes/artefacts/financial-statement-analysis/cash-flow-linkage-check.py",
    "notes/artefacts/volatility-options/bsm-svi-checks.py",
    "notes/artefacts/time-value-returns/time-value-return-checks.py",
    "notes/artefacts/point-in-time-data/bitemporal-check.py",
    "notes/artefacts/point-in-time-data/filing-checks.py",
    "notes/artefacts/point-in-time-data/filing-timestamp-checks.py",
    "notes/artefacts/funding-crowding/spiral-checks.py",
    "notes/artefacts/execution-market-making/cme-allocation-checks.py",
    "notes/artefacts/crypto-mm-microstructure/funding_checks.py",
    "notes/artefacts/execution-market-making/commodity-production-latency-checks.py",
    "notes/artefacts/execution-market-making/contract-specifications-statistics-checks.py",
    "notes/artefacts/synthetic-equity-cfd-trs/synthetic_short_checks.py",
    "notes/artefacts/model-governance-controls/reconciliation-check.py",
    "notes/artefacts/portfolio-construction/black-litterman-check.py",
    "notes/artefacts/portfolio-construction/erc-check.py",
    "notes/artefacts/portfolio-construction/erc-sharpe-check.py",
    "notes/artefacts/risk-tail-systemic/es-discrete-check.py",
    "notes/artefacts/reinforcement-learning-trading/cartea_jaimungal_checks.py",
    "notes/artefacts/portfolio-construction/shrinkage-check.py",
    "notes/artefacts/risk-parity-vol-targeting/risk-parity-checks.py",
    "notes/artefacts/volatility-options/negative-hedge-ratio-check.py",
    "notes/artefacts/risk-tail-systemic/garch-ewma-check.py",
    "notes/artefacts/backtest-inference/sharpe-zero-check.py",
    "notes/artefacts/backtest-inference/drawdown-resampling-checks.py",
]
mypy_path = "src"
python_version = "3.14"
strict = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]
