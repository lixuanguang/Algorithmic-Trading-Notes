    "notes/artefacts/macro-policy-trade/macro-policy-trade-checks.py",
    "notes/artefacts/market-simulation/order-flow-checks.py",
    "notes/artefacts/market-structure-execution-quality/order-routing-fragmentation-checks.py",
    "notes/artefacts/multi-asset-systematic-macro/macro-pricing-risk-checks.py",
    "notes/artefacts/private-capital/private-capital-checks.py",
    "notes/artefacts/private-wealth/private-wealth-checks.py",
    "notes/artefacts/rate-tree-embedded-options/rate-tree-checks.py",
    "notes/artefacts/real-assets/real-asset-checks.py",
    "notes/artefacts/statistical-learning-foundations/afml-checks.py",
