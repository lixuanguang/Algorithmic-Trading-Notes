[project]
name = "algorithmic-trading-notes"
version = "0.1.0"
description = "Structural checkers, numerical examples, research workflows and guide views for the compendium"
readme = "README.md"
requires-python = "==3.14.*"
classifiers = ["Private :: Do Not Upload"]
# The numerical package and research workflows (numpy, scipy; statsmodels, which brings pandas,
# for the regression, asset-pricing and AFML checks).
dependencies = [
    "numpy==2.4.6",
    # Typed parameter and result records of the numerical package.
    "pydantic==2.13.5",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pre-commit-hooks==6.0.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.5",
    # Type information for scipy, which ships none; its version tracks the scipy pin.
    "scipy-stubs==1.18.1.1",
]
# Spreadsheet readers of the research workflows that rerun retained evidence. A default group,
# so the workflows' imports, types and tests are checked by `make check`.
empirical = [
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
]

[build-system]
# uv uses its built-in backend when this pin matches the running uv, so no build download.
requires = ["uv_build==0.12.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading_notes"

[tool.uv]
required-version = "==0.12.7"
# The reusable code under src/trading_notes is installed as a package, so scripts and tests
# import it normally instead of modifying sys.path. It is installed non-editable: CPython
# skips an editable install's .pth file once macOS flags it hidden, as file sync can do
# inside ~/Documents. uv 0.12.7 has no project setting for this, and any `uv sync` or
# `uv run` without --no-editable reinstalls the project editable, so every such command in
# the Makefile, the pre-commit hooks, CI and the README passes --no-editable (see
# src/tests/test_installation.py). The cache keys reinstall the package whenever a source or
# data file (the guide's templates) changes, so a non-editable copy never goes stale.
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = "src/trading_notes/**/*" }]
default-groups = ["dev", "empirical"]
# Transitive versions kept equal to the other research repository where they overlap.
constraint-dependencies = ["pandas==3.0.5"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]
extend-exclude = ["reading_materials", "reading materials"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "RUF", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
# Strict checking of every maintained module: the package, its research and guide tools, and
# the tests.
files = ["src/trading_notes", "src/tests"]
# statsmodels, pandas, openpyxl and xlrd ship no type information. src/typings/ declares only the
# parts of their APIs that the package calls, typed as those calls return at the pinned versions;
# a call outside them is a type error, so extend a stub, checked against the pinned library, when
# a module needs a new call, and review the stubs when a pin moves.
mypy_path = "src:src/typings"
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

[tool.pydantic-mypy]
# Record constructors are checked like typed __init__ methods, with no extra fields.
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
# importlib mode keeps src/ off sys.path, so tests import the installed, non-editable package.
addopts = "--strict-config --strict-markers --import-mode=importlib --numprocesses=auto"
filterwarnings = ["error"]
