# statsmodels and pandas ship no type information. src/typings/ declares only the parts of their
# APIs that the numerical checks call, typed as those calls return at the pinned versions; a call
# outside them is a type error, so extend a stub, checked against the pinned library, when a
# check needs a new call, and review the stubs when a pin moves.
mypy_path = "src:src/typings"
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_unimported = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "unused-awaitable",
]

[tool.pydantic-mypy]
# Record constructors are checked like typed __init__ methods, with no extra fields.
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
# importlib mode keeps src/ off sys.path, so tests import the installed, non-editable package.
addopts = "--strict-config --strict-markers --import-mode=importlib --numprocesses=auto"
filterwarnings = ["error"]
